name: burn-stats

on:
  schedule:
    # 每 6 小时更新一次（UTC）
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burn-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 统计 LGNS 销毁量
        run: node burn-stats.mjs
      - name: 提交 burn-stats.json
        run: |
          git config user.name  "burn-stats-bot"
          git config user.email "burn-stats-bot@users.noreply.github.com"
          git add burn-stats.json
          if git diff --quiet --cached; then
            echo "没有变化，跳过提交"
          else
            git commit -m "stats: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
